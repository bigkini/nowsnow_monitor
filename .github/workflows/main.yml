name: newsnow monitor

on:
  schedule:
    - cron: '0 0 * * *'    # 09:00 KST
    - cron: '30 4 * * *'   # 13:30 KST
    - cron: '0 8 * * *'    # 17:00 KST
    - cron: '30 10 * * *'  # 19:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install cloudscraper requests

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python newsnow_monitor.py

      - name: Commit DB changes
        run: |
          git config --global user.name "kini-bot"
          git config --global user.email "bot@github.com"
          git add sent_urls.txt
          git commit -m "Update sent URLs DB (Time-filtered)" || exit 0
          git push

